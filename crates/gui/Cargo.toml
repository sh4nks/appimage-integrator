[package]
name = "appimage-integrator-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Graphical front end for appimage-integrator"

[features]
default = ["update"]
update = ["appimage-integrator-core/update"]

[dependencies]
appimage-integrator-core = { path = "../core" }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
serde_json = "1.0.154"

[build-dependencies]
cxx-qt-build = "0.10.0"
